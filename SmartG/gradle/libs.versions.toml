[versions]
agp = "8.10.1"
googleMaterial = "1.12.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.1"
languageId = "17.0.6"
material = "1.12.0"
materialVersion = "<latest_version>"
translate = "17.0.3"
languageIdCommon = "16.1.0"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
language-id = { module = "com.google.mlkit:language-id", version.ref = "languageId" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
material-v1120 = { module = "com.google.android.material:material", version.ref = "googleMaterial" }
material-vlatestversion = { module = "com.google.android.material:material", version.ref = "materialVersion" }
translate = { module = "com.google.mlkit:translate", version.ref = "translate" }
language-id-common = { group = "com.google.mlkit", name = "language-id-common", version.ref = "languageIdCommon" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }

